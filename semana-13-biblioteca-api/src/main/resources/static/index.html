<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Personal | Administración de libros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --color-principal: #176b87;
            --color-secundario: #64ccc5;
            --color-fondo: #f4f8fa;
            --color-texto: #24343b;
        }

        body {
            background-color: var(--color-fondo);
            color: var(--color-texto);
            min-height: 100vh;
        }

        .encabezado {
            color: white;
            background: linear-gradient(
                    135deg,
                    #0d4c67,
                    #176b87,
                    #64ccc5
            );
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
        }

        .encabezado h1 {
            font-weight: 700;
        }

        .encabezado p {
            opacity: 0.9;
        }

        .tarjeta-formulario,
        .tarjeta-listado {
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(34, 64, 74, 0.10);
        }

        .tarjeta-formulario {
            position: sticky;
            top: 25px;
        }

        .form-control {
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: var(--color-secundario);
            box-shadow: 0 0 0 0.2rem rgba(100, 204, 197, 0.25);
        }

        .btn-biblioteca {
            color: white;
            background-color: var(--color-principal);
            border: none;
            border-radius: 10px;
        }

        .btn-biblioteca:hover {
            color: white;
            background-color: #0d4c67;
        }

        .table thead th {
            color: var(--color-principal);
            white-space: nowrap;
        }

        .badge-disponible {
            background-color: #198754;
        }

        .badge-no-disponible {
            background-color: #6c757d;
        }

        footer {
            color: #62747c;
        }

        @media (max-width: 991px) {
            .tarjeta-formulario {
                position: static;
            }
        }
    </style>
</head>

<body>

<header class="encabezado">
    <div class="container py-5">
        <h1>📚 Biblioteca Personal</h1>
        <p class="mb-0">Administración y consulta de libros</p>
    </div>
</header>

<main class="container my-5">

    <!-- Mensajes de éxito o error -->
    <div id="mensaje"></div>

    <div class="row g-4">

        <!-- Formulario de registro -->
        <section class="col-lg-4">

            <div class="card tarjeta-formulario">

                <div class="card-body p-4">

                    <h2 class="h4 mb-4">Registrar libro</h2>

                    <form id="formularioLibro">

                        <div class="mb-3">
                            <label for="codigo" class="form-label">
                                Código
                            </label>

                            <input type="text"
                                   id="codigo"
                                   class="form-control"
                                   placeholder="Ejemplo: LIB004"
                                   maxlength="30"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="titulo" class="form-label">
                                Título
                            </label>

                            <input type="text"
                                   id="titulo"
                                   class="form-control"
                                   placeholder="Título del libro"
                                   maxlength="150"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="autor" class="form-label">
                                Autor
                            </label>

                            <input type="text"
                                   id="autor"
                                   class="form-control"
                                   placeholder="Nombre del autor"
                                   maxlength="100"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label">
                                Categoría
                            </label>

                            <input type="text"
                                   id="categoria"
                                   class="form-control"
                                   placeholder="Ejemplo: Novela"
                                   maxlength="60"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="anioPublicacion" class="form-label">
                                Año de publicación
                            </label>

                            <input type="number"
                                   id="anioPublicacion"
                                   class="form-control"
                                   min="1"
                                   step="1"
                                   placeholder="2020"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="precio" class="form-label">
                                Precio (Q)
                            </label>

                            <input type="number"
                                   id="precio"
                                   class="form-control"
                                   min="0.01"
                                   step="0.01"
                                   placeholder="85.50"
                                   required>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input type="checkbox"
                                   id="disponible"
                                   class="form-check-input"
                                   checked>

                            <label for="disponible"
                                   class="form-check-label">
                                Libro disponible
                            </label>
                        </div>

                        <div class="d-grid gap-2">

                            <button type="submit"
                                    id="btnGuardar"
                                    class="btn btn-biblioteca">
                                Guardar libro
                            </button>

                            <button type="reset"
                                    class="btn btn-outline-secondary">
                                Limpiar formulario
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </section>

        <!-- Listado de libros -->
        <section class="col-lg-8">

            <div class="card tarjeta-listado">

                <div class="card-body p-4">

                    <div class="d-flex flex-column flex-md-row
                                justify-content-between align-items-md-center
                                gap-3 mb-4">

                        <div>
                            <h2 class="h4 mb-1">Libros registrados</h2>

                            <small class="text-secondary">
                                Información almacenada en PostgreSQL
                            </small>
                        </div>

                        <button type="button"
                                class="btn btn-outline-primary"
                                onclick="cargarLibros()">
                            Actualizar listado
                        </button>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>
                            <tr>
                                <th>Código</th>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>Categoría</th>
                                <th>Año</th>
                                <th>Precio</th>
                                <th>Disponibilidad</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>

                            <tbody id="tablaLibros">
                            <tr>
                                <td colspan="8" class="text-center">
                                    Cargando libros...
                                </td>
                            </tr>
                            </tbody>

                        </table>

                    </div>

                </div>
            </div>

        </section>

    </div>
</main>

<footer class="text-center py-4">
    <small>Programación II · API REST con Spring Boot</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

    /*
 * Dirección principal de la API.
 */
    const API_URL = "/api/libros";

    /*
     * Guarda temporalmente los libros
     * obtenidos desde la API.
     */
    let librosRegistrados = [];

    /*
     * Referencias a elementos del HTML.
     */
    const formulario =
        document.getElementById("formularioLibro");

        const tablaLibros =
        document.getElementById("tablaLibros");

    formulario.addEventListener("submit", guardarLibro);

    /*
     * Cuando el documento esté listo,
     * se consultarán los libros.
     */
    document.addEventListener(
        "DOMContentLoaded",
        cargarLibros
    );

    /*
 * GET
 *
 * Obtiene todos los libros
 * almacenados en PostgreSQL.
 */
    async function cargarLibros() {

        tablaLibros.innerHTML = `
        <tr>
            <td colspan="8" class="text-center">
                Cargando libros...
            </td>
        </tr>
    `;

        try {

            const respuesta =
                await fetch(API_URL);

            if (!respuesta.ok) {
                throw new Error(
                    "No fue posible consultar los libros."
                );
            }

            librosRegistrados =
                await respuesta.json();

            mostrarLibros();

        } catch (error) {

            tablaLibros.innerHTML = `
            <tr>
                <td colspan="8"
                    class="text-center text-danger">
                    ${escaparHTML(error.message)}
                </td>
            </tr>
        `;

            mostrarMensaje(
                error.message,
                "danger"
            );
        }
    }

    /*
 * Construye las filas de la tabla.
 */
    function mostrarLibros() {

        if (librosRegistrados.length === 0) {

            tablaLibros.innerHTML = `
            <tr>
                <td colspan="8"
                    class="text-center text-secondary py-4">
                    No hay libros registrados.
                </td>
            </tr>
        `;

            return;
        }

        tablaLibros.innerHTML =
            librosRegistrados
                .map(libro => {

                    const estado =
                        libro.disponible
                            ? `
                            <span class="badge badge-disponible">
                                Disponible
                            </span>
                        `
                            : `
                            <span class="badge badge-no-disponible">
                                No disponible
                            </span>
                        `;

                    return `
                    <tr>
                        <td>${escaparHTML(libro.codigo)}</td>
                        <td>${escaparHTML(libro.titulo)}</td>
                        <td>${escaparHTML(libro.autor)}</td>
                        <td>${escaparHTML(libro.categoria)}</td>
                        <td>${libro.anioPublicacion}</td>
                        <td>Q ${Number(libro.precio).toFixed(2)}</td>
                        <td>${estado}</td>
                        <td>
                            <button
                                type="button"
                                class="btn btn-sm btn-danger"
                                onclick="eliminarLibro(${libro.id})">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                `;

                })
                .join("");
    }

    /*
 * Evita que el contenido de los libros
 * sea interpretado como código HTML.
 */
    function escaparHTML(valor) {

        return String(valor ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    /*
 * Muestra mensajes de éxito o error.
 */
    function mostrarMensaje(texto, tipo) {

        const mensaje = document.getElementById("mensaje");

        mensaje.innerHTML = `
        <div class="alert alert-${tipo} alert-dismissible fade show"
             role="alert">
            ${escaparHTML(texto)}
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Cerrar">
            </button>
        </div>
    `;
    }

    /*
 * POST
 *
 * Registra un libro nuevo en la API.
 */
    async function guardarLibro(evento) {

        evento.preventDefault();

        const libro = {
            codigo: document.getElementById("codigo").value,
            titulo: document.getElementById("titulo").value,
            autor: document.getElementById("autor").value,
            categoria: document.getElementById("categoria").value,
            anioPublicacion: Number(
                document.getElementById("anioPublicacion").value
            ),
            precio: Number(
                document.getElementById("precio").value
            ),
            disponible: document.getElementById("disponible").checked
        };

        try {

            const respuesta = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(libro)
            });

            if (!respuesta.ok) {
                throw new Error(
                    "No fue posible registrar el libro. Verifica los datos."
                );
            }

            mostrarMensaje(
                "Libro registrado correctamente.",
                "success"
            );

            formulario.reset();

            await cargarLibros();

        } catch (error) {

            mostrarMensaje(
                error.message,
                "danger"
            );
        }
    }

    async function eliminarLibro(id) {

        const libro = librosRegistrados.find(
            libro => libro.id === id
        );

        const confirmado = confirm(
            `¿Deseas eliminar el libro "${libro.titulo}"?`
        );

        if (!confirmado) {
            return;
        }

        try {

            const respuesta = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!respuesta.ok) {
                throw new Error(
                    "No fue posible eliminar el libro."
                );
            }

            mostrarMensaje(
                "Libro eliminado correctamente.",
                "success"
            );

            await cargarLibros();

        } catch (error) {

            mostrarMensaje(
                error.message,
                "danger"
            );
        }
    }




</script>

</body>
</html>
